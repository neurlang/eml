<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exp-Log Regression Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a2e;
            color: #eee;
            padding: 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            background-color: #16213e;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            color: #00d9ff;
        }

        /* Two-column responsive layout */
        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 15px;
            align-items: start;
        }

        /* Right column contains the last two panels */
        .right-column {
            display: flex;
            flex-direction: column;
            gap: 15px;
            min-width: 0;
        }

        .panel {
            background-color: #16213e;
            border-radius: 5px;
            margin-bottom: 15px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            min-width: 0;
        }

        /* Remove extra margins inside the grid */
        .layout > .panel,
        .right-column > .panel {
            margin-bottom: 0;
        }

        .panel-title {
            text-align: center;
            background-color: #0f3460;
            padding: 8px;
            border-radius: 3px;
            margin-bottom: 15px;
            color: white;
            font-size: 1.1em;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 10px;
        }

        th,
        td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #0f3460;
        }

        th {
            background-color: #0f3460;
            color: #eee;
        }

        tr:last-child td {
            border-bottom: none;
        }

        input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #0f3460;
            border-radius: 3px;
            background-color: #1a1a2e;
            color: #eee;
            text-align: center;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #e94560;
        }

        .scroll-container {
            max-height: 250px;
            overflow-y: auto;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.2s;
        }

        .btn-add {
            background-color: #45e960;
            color: white;
        }

        .btn-add:hover {
            background-color: #3ec754;
        }

        .btn-remove {
            background-color: #e94560;
            color: white;
        }

        .btn-remove:hover {
            background-color: #c73e54;
        }

        .btn-clear {
            background-color: #ffa502;
            color: white;
        }

        .btn-clear:hover {
            background-color: #e69e02;
        }

        .calculation-panel {
            min-height: 100px;
        }

        .scroll-info {
            text-align: center;
            font-size: 0.85em;
            color: #aaa;
            margin-top: 5px;
        }

        #input,
        #output {
            display: block;
            font-family: monospace;
            overflow-wrap: anywhere;
        }

        small {
            padding: 2px 4px;
            background-color: green;
            border: none;
            border-radius: 2px;
        }

        #figure {
            max-width: 100%;
            height: auto;
        }

        /* Responsive: stack the columns on smaller screens */
        @media (max-width: 700px) {
            body {
                padding: 10px;
            }

            .container {
                width: 100%;
            }

            .layout {
                grid-template-columns: minmax(0, 1fr);
            }

            .buttons button {
                flex: 1 1 auto;
            }
        }
    </style>
</head>

<body>
<a href="https://github.com/neurlang/eml"><img style="float:right;position:absolute;top:0px;right:0px;" decoding="async" src="https://github.blog/wp-content/uploads/2008/12/forkme_right_darkblue_121621.png" class="attachment-full size-full" alt="Fork me on GitHub" loading="lazy" data-recalc-dims="1"></a>
    <div class="container">

        <h1>Exp-Log Regression Calculator</h1>

        <div class="layout">

            <!-- LEFT COLUMN: First panel -->
            <div class="panel">
                <div class="panel-title">Data Points List</div>

                <div class="scroll-container">
                    <table id="dataTable">
                        <thead>
                            <tr>
                                <th width="10%">#</th>
                                <th width="45%">X Value</th>
                                <th width="45%">Y Value</th>
                            </tr>
                        </thead>
                        <tbody id="dataBody">
                        </tbody>
                    </table>
                </div>

                <div class="scroll-info">
                    ▲<br>
                    Scroll
                </div>
                

                <!-- Second panel: Data point controls -->
                <div class="panel">
                    <div class="buttons">
                        <button class="btn-add" onclick="addOne()">
                            Add Point
                        </button>

                        <button class="btn-remove" onclick="removeSelected()">
                            Remove Selected
                        </button>

                        <button class="btn-clear" onclick="clearAll()">
                            Clear All
                        </button>
                    </div>

                    <div style="margin-bottom:10px; text-align:center;">
                        <label for="lambda" style="color:#aaa;">
                            Complexity penalty per token (λ)
                        </label>

                        <input
                            type="number"
                            id="lambda"
                            value="0"
                            step="any"
                            style="width:120px; margin-left:8px;"
                        >
                    </div>
                    <div class="panel-title">
                        <button id="calculate" onclick="calculate()">
                            CALCULATION
                        </button>
                    </div>
                </div>

                
            </div>

            <!-- RIGHT COLUMN: Last two panels -->
            <div class="right-column">

                <!-- Third panel: Calculation -->
                <div class="panel calculation-panel">
                    <div class="panel-title">Regression result</div>


                    <div id="input"></div>
                    <div id="output"></div>

                    <div>
                        <img
                            style="width:100%"
                            id="figure"
                            alt="Regression result figure"
                        >
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="wasm_exec.js"></script>

    <script>
        let dataPoints = [
            { x: 1, y: 3.14159 }
        ];

        function renderTable() {
            const tbody = document.getElementById('dataBody');
            tbody.innerHTML = '';

            dataPoints.forEach((point, index) => {
                const row = document.createElement('tr');
                const isChecked = point.selected ? 'checked' : '';

                row.innerHTML = `
                    <td>
                        <input
                            type="checkbox"
                            data-index="${index}"
                            ${isChecked}
                        >
                    </td>
                    <td>
                        <input
                            type="number"
                            value="${point.x}"
                            step="0.1"
                            onchange="updatePoint(${index}, 'x', this.value)"
                        >
                    </td>
                    <td>
                        <input
                            type="number"
                            value="${point.y}"
                            step="0.1"
                            onchange="updatePoint(${index}, 'y', this.value)"
                        >
                    </td>
                `;

                row.onclick = function(e) {
                    if (e.target.type !== 'checkbox') {
                        const checkbox = row.querySelector(
                            'input[type="checkbox"]'
                        );

                        checkbox.checked = !checkbox.checked;
                        dataPoints[index].selected = checkbox.checked;
                    }
                };

                tbody.appendChild(row);
            });
        }

        function updatePoint(index, field, value) {
            dataPoints[index][field] = parseFloat(value);
        }

        function addOne() {
            dataPoints.push({ x: 0, y: 0 });
            renderTable();
        }

        function removeSelected() {
            dataPoints = dataPoints.filter((point, index) => {
                const checkbox = document.querySelector(
                    `input[data-index="${index}"]`
                );

                return !checkbox.checked;
            });

            dataPoints.forEach(point => point.selected = false);
            renderTable();
        }

        function clearAll() {
            if (confirm('Clear all data points?')) {
                dataPoints = [];
                renderTable();
            }
        }

        window.addEventListener('load', () => {
            renderTable();
        });

        function calculate() {
            document.getElementById('input').innerHTML =
                JSON.stringify(dataPoints.map(point => [point.x, point.y]));

            if (!WebAssembly.instantiateStreaming) {
                WebAssembly.instantiateStreaming = async (
                    resp,
                    importObject
                ) => {
                    const source = await (await resp).arrayBuffer();

                    return await WebAssembly.instantiate(
                        source,
                        importObject
                    );
                };
            }

            const go = new Go();
            let mod, inst;

            WebAssembly.instantiateStreaming(
                fetch("emlui.wasm"),
                go.importObject
            )
                .then(async (result) => {
                    mod = result.module;
                    inst = result.instance;

                    console.clear();

                    await go.run(inst);

                    inst = await WebAssembly.instantiate(
                        mod,
                        go.importObject
                    );
                })
                .catch((err) => {
                    console.error(err);
                });
        }
    </script>
</body>
</html>
